<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aliya ❤️</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#000;
color:#333;
overflow-x:hidden;
}

.page{
display:none;
min-height:100vh;
}

.page.active{
display:block;
}

.top{
height:125px;
background:#000;
color:white;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:25px;
font-weight:bold;
padding:15px;
}

.paper{
min-height:calc(100vh - 125px);
padding:45px 18px 60px;
text-align:center;
background-color:#fff;
background-image:
linear-gradient(#dce6e8 1px,transparent 1px),
linear-gradient(90deg,#dce6e8 1px,transparent 1px);
background-size:22px 22px;
}

.content{
max-width:430px;
margin:auto;
}

h1{
color:#c93679;
font-size:26px;
line-height:1.3;
}

p{
font-size:17px;
line-height:1.6;
}

.character{
font-size:90px;
margin:15px 0 25px;
}

.box{
background:white;
border:1px solid #aaa;
border-radius:12px;
padding:22px 17px;
box-shadow:0 5px 18px #0002;
font-size:17px;
line-height:1.65;
}

button{
border:0;
background:#d93682;
color:white;
padding:13px 24px;
border-radius:11px;
font-size:16px;
font-weight:bold;
margin-top:22px;
box-shadow:0 5px 14px #d9368240;
}

button:active{
transform:scale(.96);
}

.memories{
display:flex;
flex-direction:column;
gap:20px;
margin:25px auto;
max-width:330px;
}

.memory{
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 6px 20px #0002;
}

.memory img{
width:100%;
height:300px;
object-fit:cover;
border-radius:8px;
background:#f5c9dc;
}

.hearts{
font-size:20px;
color:#d93682;
margin-top:8px;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:25px;
}

.option{
background:white;
color:#333;
border:1px solid #ddd;
padding:18px 8px;
border-radius:12px;
box-shadow:0 4px 14px #0001;
}

.option b{
display:block;
color:#c93679;
font-size:17px;
margin:8px 0;
}

.option span{
font-size:13px;
line-height:1.4;
}

.meter{
height:22px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:35px auto 12px;
max-width:380px;
}

.fill{
height:100%;
width:0;
background:#d93682;
transition:2s;
}

.float{
position:fixed;
font-size:25px;
animation:up 3s linear forwards;
pointer-events:none;
}

@keyframes up{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-100vh);
opacity:0;
}
}

.small{
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<div class="page active" id="page1">

<div class="top">
Aliya... ek baar meri baat sun lo 🥺❤️
</div>

<div class="paper">

<div class="content">

<div class="character">🥺🧸</div>

<div
